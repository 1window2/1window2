name: GitHub-Profile-Summary-Cards

on:
  schedule: # execute every 12 hours
    - cron: "0 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: profile-cards-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: refresh-profile-card-cache
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate profile cards
        shell: bash
        env:
          BASE_URL: https://github-profile-summary-cards-two-pi.vercel.app/api/cards
          CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          staging="$RUNNER_TEMP/profile-cards"
          mkdir -p "$staging"

          fetch_card() {
            local filename="$1"
            local endpoint="$2"
            local marker="$3"
            local url="${BASE_URL}/${endpoint}&v=${CACHE_BUSTER}&source=cache"

            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 180 \
              "$url" --output "$staging/$filename"
            grep -q '^<svg' "$staging/$filename"
            grep -Fq "$marker" "$staging/$filename"
          }

          fetch_card \
            "0-profile-details.svg" \
            "profile-details?username=1window2&theme=nord_dark&name=1window2&period=all_time" \
            "contributions over all time"
          fetch_card \
            "1-repos-per-language.svg" \
            "repos-per-language?username=1window2&theme=nord_dark" \
            "Top Languages by Repo"
          fetch_card \
            "2-most-commit-language.svg" \
            "most-commit-language?username=1window2&theme=nord_dark" \
            "Top Languages by Commit"
          fetch_card \
            "3-stats.svg" \
            "stats?username=1window2&theme=nord_dark" \
            "Total Commits:"
          fetch_card \
            "4-productive-time.svg" \
            "productive-time?username=1window2&theme=nord_dark&utcOffset=9" \
            "Commits (UTC +9.00)"

          python3 - "$staging" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          staging = pathlib.Path(sys.argv[1])
          cards = sorted(staging.glob("*.svg"))
          if len(cards) != 5:
              raise SystemExit(f"expected 5 SVG cards, found {len(cards)}")
          for card in cards:
              ET.parse(card)
              print(f"validated {card.name} ({card.stat().st_size} bytes)")
          PY

      - name: Publish cache branch
        shell: bash
        run: |
          set -euo pipefail

          branch_dir="$RUNNER_TEMP/profile-cards-branch"
          git fetch origin \
            profile-cards-cache:refs/remotes/origin/profile-cards-cache
          git worktree add --detach \
            "$branch_dir" refs/remotes/origin/profile-cards-cache

          mkdir -p "$branch_dir/profile-summary-card-output/cache/nord_dark"
          cp "$RUNNER_TEMP/profile-cards/"*.svg \
            "$branch_dir/profile-summary-card-output/cache/nord_dark/"
          git -C "$branch_dir" add profile-summary-card-output/cache/nord_dark

          if git -C "$branch_dir" diff --cached --quiet; then
            echo "Profile card cache is already current."
            exit 0
          fi

          git -C "$branch_dir" config user.name "github-actions[bot]"
          git -C "$branch_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$branch_dir" commit -m "Refresh profile card cache"
          git -C "$branch_dir" push origin HEAD:profile-cards-cache
