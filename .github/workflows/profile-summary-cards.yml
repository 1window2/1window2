name: GitHub-Profile-Summary-Cards

on:
  schedule: # execute every 12 hours
    - cron: "0 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: profile-cards-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: refresh-profile-card-cache
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out private profile-card action
        uses: actions/checkout@v4
        with:
          repository: 1window2/github-profile-summary-cards
          ref: d4b7ffdbbb9750d6b410abac3dd847fb9ef51e7a
          token: ${{ secrets.SUMMARY_CARD_TOKEN_PRIVATE }}
          path: .github/actions/profile-summary-cards
          persist-credentials: false

      - name: Generate profile cards
        uses: ./.github/actions/profile-summary-cards
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN_PRIVATE }}
        with:
          USERNAME: 1window2
          UTC_OFFSET: 9
          INCLUDE_PRIVATE_REPOS: true
          AUTO_PUSH: false
          THEME: nord_dark
          NAME: 1window2
          PROFILE_PERIOD: all_time
          COMMIT_LANGUAGE_PERIOD: all_time

      - name: Validate profile cards
        shell: bash
        run: |
          set -euo pipefail

          staging="$RUNNER_TEMP/profile-cards"
          mkdir -p "$staging"
          cp profile-summary-card-output/nord_dark/*.svg "$staging/"

          grep -Fq "contributions over all time" "$staging/0-profile-details.svg"
          grep -Fq "Top Languages by Repo" "$staging/1-repos-per-language.svg"
          grep -Fq "Top Languages by Commit" "$staging/2-most-commit-language.svg"
          grep -Fq "Total Commits:" "$staging/3-stats.svg"
          grep -Fq "Commits (UTC +9.00)" "$staging/4-productive-time.svg"

          python3 - "$staging" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          staging = pathlib.Path(sys.argv[1])
          cards = sorted(staging.glob("*.svg"))
          if len(cards) != 5:
              raise SystemExit(f"expected 5 SVG cards, found {len(cards)}")
          for card in cards:
              ET.parse(card)
              print(f"validated {card.name} ({card.stat().st_size} bytes)")
          PY

      - name: Publish cache branch
        shell: bash
        run: |
          set -euo pipefail

          branch_dir="$RUNNER_TEMP/profile-cards-branch"
          git fetch origin \
            profile-cards-cache:refs/remotes/origin/profile-cards-cache
          git worktree add --detach \
            "$branch_dir" refs/remotes/origin/profile-cards-cache

          mkdir -p "$branch_dir/profile-summary-card-output/cache/nord_dark"
          cp "$RUNNER_TEMP/profile-cards/"*.svg \
            "$branch_dir/profile-summary-card-output/cache/nord_dark/"
          git -C "$branch_dir" add profile-summary-card-output/cache/nord_dark

          if git -C "$branch_dir" diff --cached --quiet; then
            echo "Profile card cache is already current."
            exit 0
          fi

          git -C "$branch_dir" config user.name "github-actions[bot]"
          git -C "$branch_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$branch_dir" commit -m "Refresh profile card cache"
          git -C "$branch_dir" push origin HEAD:profile-cards-cache
